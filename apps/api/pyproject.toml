[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsverse-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.9,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1", "cryptography>=43,<52",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "hypothesis>=6,<7"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
